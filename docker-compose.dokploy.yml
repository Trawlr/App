# Only use this if you know what you're doing...
x-trawlr-env: &trawlr-env
  - DEBUG=${DEBUG:-False}
  - SECRET_KEY=${SECRET_KEY}
  - DJANGO_SETTINGS_MODULE=trawlr.settings
  - DJANGO_ALLOW_ASYNC_UNSAFE=true
  - POSTGRES_DB=${POSTGRES_DB:-trawlr}
  - POSTGRES_USER=${POSTGRES_USER:-trawlr}
  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  - POSTGRES_HOST=db
  - POSTGRES_PORT=5432
  - RABBITMQ_HOST=rabbitmq
  - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-trawlr}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
  - TRAWLR_STORAGE_ROOT=/data/trawlr
  - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
  - LISTENER_HEALTH_PORT=8001

x-trawlr: &trawlr
  image: ghcr.io/trawlr/trawlr:latest
  environment: *trawlr-env
  restart: always
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-trawlr-worker: &trawlr-worker
  image: ghcr.io/trawlr/trawlr:latest
  environment: *trawlr-env
  restart: always
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    web:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    # ports:
    #   - "${TRAWLR_PORT:-8000}:8000"
    volumes:
      - media_data:/data/trawlr:ro
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      web:
        condition: service_healthy
    restart: always

  web:
    <<: *trawlr
    volumes:
      - media_data:/data/trawlr
      - sessions:/app/sessions
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\", 8001), timeout=2); s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne --proxy-headers -b 0.0.0.0 -p 8001 trawlr.asgi:application"

  downloader:
    <<: *trawlr-worker
    volumes:
      - media_data:/data/trawlr
      - sessions:/app/sessions
    command: dramatiq-gevent tasks --queues trawlr.default trawlr.downloads -p 1 -t 20

  concierge:
    <<: *trawlr-worker
    volumes:
      - media_data:/data/trawlr
      - sessions:/app/sessions
    command: dramatiq tasks --queues trawlr.scans.history trawlr.scans.members --processes 1 --threads 1

  processor:
    <<: *trawlr-worker
    volumes:
      - media_data:/data/trawlr
      - sessions:/app/sessions
    command: dramatiq events.processor --queues trawlr.events.telegram --processes 2 --threads 4

  listener:
    <<: *trawlr-worker
    volumes:
      - media_data:/data/trawlr
      - sessions:/app/sessions
    command: python -m listener_service.main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    <<: *trawlr-worker
    command: python -m trawlr.scheduler

  db:
    image: postgres:18.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-trawlr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-trawlr}
    command: postgres -c max_connections=1000
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-trawlr}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
      - source: rabbitmq-conf
        target: /etc/rabbitmq/conf.d/99-custom.conf
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 30s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  rabbitmq_data:
  sessions:

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."
  rabbitmq-conf:
    content: |
      # Disable consumer timeout (default 30min) for long-running tasks
      consumer_timeout = 86400000
  nginx-conf:
    content: |
      # Required for WebSocket upgrade mapping
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }

      server {
          listen 8000;
          server_name _;

          client_max_body_size 0;

          # Use Docker's internal DNS and re-resolve every 30s
          # This prevents stale IPs when containers are redeployed
          resolver 127.0.0.11 valid=30s ipv6=off;
          set $$backend http://web:8001;

          # Proxy all requests to Daphne
          location / {
              proxy_pass $$backend;

              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;

              # WebSocket support for download progress
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;

              # Don't buffer responses from Daphne
              proxy_buffering off;
          }

          # Internal location for media files served via X-Accel-Redirect
          # Django handles auth, then redirects here — never directly accessible
          location /protected-media/ {
              internal;
              alias /data/trawlr/;

              # Let Nginx handle range requests for video seeking
              add_header Accept-Ranges bytes;
          }

          # Internal location for thumbnails served via X-Accel-Redirect
          location /protected-thumbnails/ {
              internal;
              alias /data/trawlr/;
          }
      }
