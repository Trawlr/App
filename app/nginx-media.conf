# Required for WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8000;
    server_name _;

    client_max_body_size 0;

    # Use Docker's internal DNS and re-resolve every 30s
    # This prevents stale IPs when containers are redeployed
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://web:8001;

    # Proxy all requests to Daphne
    location / {
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for download progress
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Don't buffer responses from Daphne
        proxy_buffering off;
    }

    # Internal location for media files served via X-Accel-Redirect
    # Django handles auth, then redirects here — never directly accessible
    location /protected-media/ {
        internal;
        alias /data/trawlr/;

        # Let Nginx handle range requests for video seeking
        add_header Accept-Ranges bytes;
    }

    # Internal location for thumbnails served via X-Accel-Redirect
    location /protected-thumbnails/ {
        internal;
        alias /data/trawlr/;
    }
}
