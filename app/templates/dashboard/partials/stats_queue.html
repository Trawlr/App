<div class="d-flex justify-content-between align-items-center mb-2">
    <span class="text-muted small">Pending</span>
    <span class="fw-bold">{{ queue_stats.pending|default:0 }}</span>
</div>
<div class="d-flex justify-content-between align-items-center mb-2">
    <span class="text-muted small">Downloading</span>
    <span class="fw-bold text-primary">{{ queue_stats.downloading|default:0 }}</span>
</div>
<div class="d-flex justify-content-between align-items-center mb-2">
    <span class="text-muted small">Paused</span>
    <span class="fw-bold text-warning">{{ queue_stats.paused|default:0 }}</span>
</div>
<div class="d-flex justify-content-between align-items-center">
    <span class="text-muted small">Failed</span>
    <span class="fw-bold {% if queue_stats.failed > 0 %}text-danger{% endif %}">{{ queue_stats.failed|default:0 }}</span>
</div>
