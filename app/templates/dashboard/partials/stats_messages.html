{% load humanize %}
<div class="d-flex align-items-center mb-3">
    <div class="metric-avatar me-3">
        <i class="bi bi-chat-square"></i>
    </div>
    <div>
        <small class="text-muted d-block">MESSAGES ARCHIVED</small>
        <h3 class="m-0 fw-bold">{{ total_messages|default:0|intcomma }}</h3>
    </div>
</div>
<div class="d-flex gap-4">
    <div>
        <span class="fw-bold text-primary">{{ messages_today|default:0|intcomma }}</span>
        <small class="text-muted d-block">Today</small>
    </div>
    <div>
        <span class="fw-bold">{{ messages_week|default:0|intcomma }}</span>
        <small class="text-muted d-block">This Week</small>
    </div>
</div>
