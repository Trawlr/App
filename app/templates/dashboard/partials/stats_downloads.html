{% load humanize %}
<div class="d-flex align-items-center mb-3">
    <div class="metric-avatar me-3">
        <i class="bi bi-download"></i>
    </div>
    <div>
        <small class="text-muted d-block">FILES DOWNLOADED</small>
        <h3 class="m-0 fw-bold">{{ total_files|default:0|intcomma }}</h3>
    </div>
</div>
<div class="d-flex gap-4">
    <div>
        <span class="fw-bold text-success">{{ downloads_today|default:0|intcomma }}</span>
        <small class="text-muted d-block">Today</small>
    </div>
    <div>
        <span class="fw-bold">{{ downloads_week|default:0|intcomma }}</span>
        <small class="text-muted d-block">This Week</small>
    </div>
</div>
