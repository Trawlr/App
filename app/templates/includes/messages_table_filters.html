{% load audit_extras %}

<div class="card-header border-bottom py-2" style="border-color: var(--tg-border) !important;">
    <div class="d-flex flex-wrap {% if channels %}align-items-center{% else %}justify-content-between align-items-center{% endif %} gap-2">
        <!-- Media type filter (far left) -->
        <div class="btn-group btn-group-sm" role="group">
            <a href="?q={{ search }}&sort={{ sort }}&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if not media_filter %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2">All</a>
            <a href="?q={{ search }}&media=media&sort={{ sort }}&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if media_filter == 'media' %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2">Media</a>
            <a href="?q={{ search }}&media=text&sort={{ sort }}&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if media_filter == 'text' %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2">Text</a>
            <a href="?q={{ search }}&media=photo&sort={{ sort }}&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if media_filter == 'photo' %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2">
                <i class="bi bi-image" style="font-size: 16px;"></i>
            </a>
            <a href="?q={{ search }}&media=video&sort={{ sort }}&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if media_filter == 'video' %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2">
                <i class="bi bi-camera-video" style="font-size: 16px;"></i>
            </a>
            <a href="?q={{ search }}&media=file&sort={{ sort }}&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if media_filter == 'file' %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2">
                <i class="bi bi-file-earmark" style="font-size: 16px;"></i>
            </a>
        </div>

        {% if channels %}
        <!-- Searchable channel filter -->
        <div x-data="{
            open: false,
            search: '',
            selected: '{{ channel_filter }}',
            selectedLabel: '{% if channel_filter %}{% for c in channels %}{% if c.pk|stringformat:'s' == channel_filter %}{{ c|display_title|truncatechars:30 }}{% endif %}{% endfor %}{% else %}All Sources{% endif %}',
            channels: [
                { value: '', label: 'All Sources' },
                {% for channel in channels %}
                { value: '{{ channel.pk }}', label: '{{ channel|display_title|truncatechars:50|escapejs }}' },
                {% endfor %}
            ],
            get filtered() {
                if (!this.search) return this.channels;
                return this.channels.filter(c => c.label.toLowerCase().includes(this.search.toLowerCase()));
            },
            select(channel) {
                this.selected = channel.value;
                this.selectedLabel = channel.label;
                this.open = false;
                this.search = '';
                location.href = '?q={{ search }}&media={{ media_filter }}&sort={{ sort }}&per_page={{ per_page }}&channel=' + channel.value;
            }
        }" class="position-relative" style="min-width: 180px;">
            <button type="button"
                    class="form-select form-select-sm text-start"
                    style="width: auto; min-width: 180px;"
                    @click="open = !open">
                <span x-text="selectedLabel" class="text-truncate"></span>
            </button>
            <div x-show="open"
                 x-transition
                 @click.outside="open = false; search = ''"
                 class="position-absolute mt-1 rounded border"
                 style="z-index: 1050; max-height: 300px; overflow: hidden; min-width: 220px; background: var(--tg-surface); border-color: var(--tg-border) !important;">
                <div class="p-2 border-bottom" style="border-color: var(--tg-border) !important;">
                    <input type="text"
                           x-model="search"
                           @keydown.escape="open = false"
                           placeholder="Search sources..."
                           class="form-control form-control-sm"
                           @click.stop>
                </div>
                <div style="max-height: 240px; overflow-y: auto;">
                    <template x-for="channel in filtered" :key="channel.value">
                        <button type="button"
                                class="dropdown-item px-3 py-2 text-truncate w-100 text-start"
                                :class="{ 'active': selected === channel.value }"
                                @click="select(channel)"
                                x-text="channel.label">
                        </button>
                    </template>
                    <div x-show="filtered.length === 0" class="px-3 py-2 text-muted small">
                        No sources found
                    </div>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Search -->
        <form method="get" class="d-flex gap-2 align-items-center {% if channels %}{% else %}flex-grow-1{% endif %}" style="max-width: 350px;">
            <input type="hidden" name="media" value="{{ media_filter }}">
            <input type="hidden" name="sort" value="{{ sort }}">
            <input type="hidden" name="per_page" value="{{ per_page }}">
            {% if channel_filter %}<input type="hidden" name="channel" value="{{ channel_filter }}">{% endif %}
            <div class="input-group input-group-sm">
                <span class="input-group-text">
                    <i class="bi bi-search" style="font-size: 14px;"></i>
                </span>
                <input type="text" class="form-control" placeholder="Search posts..." name="q" value="{{ search }}">
                <button type="submit" class="btn btn-primary btn-sm" style="padding: 0 12px;">
                    <i class="bi bi-funnel" style="font-size: 14px;"></i>
                </button>
                {% if search %}
                <a href="?media={{ media_filter }}&sort={{ sort }}&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn btn-outline-secondary btn-sm" title="Clear search">
                    <i class="bi bi-x" style="font-size: 14px;"></i>
                </a>
                {% endif %}
            </div>
        </form>

        <div class="d-flex gap-2 align-items-center {% if channels %}ms-auto{% endif %}">
            <!-- Total count -->
            <span class="text-muted">{{ total_count|default:0 }} posts</span>

            <!-- Per page -->
            <select class="form-select form-select-sm" style="width: auto;" onchange="location.href='?q={{ search }}&media={{ media_filter }}&sort={{ sort }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}&per_page=' + this.value">
                <option value="10" {% if per_page == 10 %}selected{% endif %}>10</option>
                <option value="25" {% if per_page == 25 %}selected{% endif %}>25</option>
                <option value="50" {% if per_page == 50 %}selected{% endif %}>50</option>
                <option value="100" {% if per_page == 100 %}selected{% endif %}>100</option>
                {% if show_500_per_page|default:True %}
                <option value="500" {% if per_page == 500 %}selected{% endif %}>500</option>
                {% endif %}
            </select>

            <!-- Sort order -->
            <div class="btn-group btn-group-sm" role="group">
                <a href="?q={{ search }}&media={{ media_filter }}&sort=newest&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if sort == 'newest' %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2" title="Newest first">
                    <i class="bi bi-arrow-down" style="font-size: 16px;"></i>
                </a>
                <a href="?q={{ search }}&media={{ media_filter }}&sort=oldest&per_page={{ per_page }}{% if channel_filter %}&channel={{ channel_filter }}{% endif %}" class="btn {% if sort == 'oldest' %}btn-primary{% else %}btn-outline-secondary{% endif %} px-2" title="Oldest first">
                    <i class="bi bi-arrow-up" style="font-size: 16px;"></i>
                </a>
            </div>
        </div>
    </div>
</div>
