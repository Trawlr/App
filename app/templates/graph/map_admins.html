{% extends "graph/map_base.html" %}

{% block map_controls %}
<div class="d-flex align-items-center gap-2">
    <label class="btn-map" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
        <input type="checkbox" id="hide-bots" onchange="applyFilters()" style="cursor: pointer;">
        Hide Bots
    </label>
    <button class="btn-map active" id="labels-btn" onclick="toggleLabels()" title="Show/hide labels">
        <i class="bi bi-tag-fill" style="font-size: 14px;" id="labels-icon"></i>
    </button>
    <button class="btn-map" onclick="togglePhysics()" id="physics-btn" title="Pause/Resume physics">
        <i class="bi bi-pause-fill" style="font-size: 14px;" id="physics-icon"></i>
    </button>
    <button class="btn-map" onclick="resetZoom()" title="Fit to screen">
        <i class="bi bi-arrows-fullscreen" style="font-size: 14px;"></i>
    </button>
</div>
{% endblock %}

{% block map_legend %}
<div class="legend-item">
    <span class="legend-dot" style="background: #64748b;"></span>
    <span>Channels</span>
</div>
<div class="legend-item">
    <span class="legend-dot" style="background: #ef4444;"></span>
    <span>Admins</span>
</div>
<div class="legend-item">
    <span class="legend-dot" style="background: #f59e0b;"></span>
    <span>Creators</span>
</div>
{% endblock %}

{% block map_js %}
<script>
function applyFilters() {
    const hideBots = document.getElementById('hide-bots').checked;
    const params = hideBots ? 'hide_bots=1' : '';
    loadMapData('{% url "graph:api_admins" %}', params);
}

document.addEventListener('DOMContentLoaded', function() {
    applyFilters();
});
</script>
{% endblock %}
