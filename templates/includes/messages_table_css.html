<style>
.table-row {
    transition: background-color 0.15s ease;
}
.table-row:hover {
    background-color: var(--tg-hover-bg) !important;
}
.table-row.expandable:hover .expand-icon {
    opacity: 1;
}
.expand-icon {
    opacity: 0.5;
}
.expand-row td {
    background: transparent !important;
}
.thumbnail-hover-preview {
    position: fixed;
    z-index: 9999;
    padding: 4px;
    background: var(--tg-card-bg);
    border: 1px solid var(--tg-border);
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
}
.thumbnail-hover-preview.visible {
    opacity: 1;
}
.thumbnail-hover-preview img {
    max-width: 400px;
    max-height: 300px;
    border-radius: 4px;
    display: block;
}
.thumbnail-preview {
    cursor: pointer;
    transition: transform 0.15s ease;
}
.thumbnail-preview:hover {
    transform: scale(1.05);
}
.copy-id {
    cursor: pointer;
    transition: color 0.15s ease;
}
.copy-id:hover {
    color: var(--tg-accent) !important;
    text-decoration: underline;
}
.btn-menu-primary {
    color: var(--bs-primary) !important;
    border-color: var(--bs-primary) !important;
    background: transparent;
    padding: 0.25rem 0.5rem;
}
.btn-menu-primary:hover,
.btn-menu-primary:focus,
.btn-menu-primary:active {
    color: var(--bs-primary) !important;
    border-color: var(--bs-primary) !important;
    background: rgba(var(--bs-primary-rgb), 0.1);
}
.thumb-type-badge {
    position: absolute;
    top: 2px;
    left: 2px;
    padding: 1px 3px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.9;
}
.thumb-album-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    padding: 0 3px;
    border-radius: 3px;
    font-size: 0.6rem;
    opacity: 0.9;
}
.reply-indicator {
    padding: 2px 8px;
    background: rgba(var(--bs-info-rgb), 0.15);
    border-left: 2px solid var(--bs-info);
    border-radius: 0 4px 4px 0;
    display: inline-block;
}
.reply-indicator a {
    color: var(--bs-info);
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.reply-indicator a:hover {
    color: var(--bs-info);
    text-decoration: underline !important;
}
.highlight-flash {
    animation: highlight-flash 2s ease-out;
}
@keyframes highlight-flash {
    0% {
        background-color: rgba(var(--bs-info-rgb), 0.3);
    }
    100% {
        background-color: transparent;
    }
}
.search-content mark {
    background-color: rgba(251, 191, 36, 0.3);
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
}
/* Dropdown menu styling */
.dropdown-hover .dropdown-menu {
    background: var(--tg-card-bg) !important;
    border: 1px solid var(--tg-border) !important;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.5);
}
.dropdown-hover .dropdown-menu .dropdown-item {
    color: var(--tg-text) !important;
}
.dropdown-hover .dropdown-menu .dropdown-item:hover {
    background-color: var(--tg-hover-bg) !important;
}
.dropdown-hover .dropdown-menu .dropdown-divider {
    border-color: var(--tg-border) !important;
}
/* Deleted message styling */
.table-row.deleted {
    background: rgba(220, 53, 69, 0.03) !important;
}
</style>

<!-- Thumbnail Hover Preview -->
<div id="thumbnailHoverPreview" class="thumbnail-hover-preview">
    <img src="" alt="Preview" id="thumbnailHoverImg">
</div>
