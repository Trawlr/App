x-trawlr: &trawlr
  build:
    context: .
    dockerfile: ./Dockerfile
  env_file: .env-local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-trawlr-worker: &trawlr-worker
  build:
    context: .
    dockerfile: ./Dockerfile
  env_file: .env-local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    web:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${TRAWLR_PORT:-8000}:8000"
    volumes:
      - media_data:${TRAWLR_STORAGE_ROOT:-/data/trawlr}:ro
      - ./nginx-media.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
        restart: true

  web:
    <<: *trawlr
    volumes:
      - media_data:${TRAWLR_STORAGE_ROOT:-/data/trawlr}
      - sessions:/app/sessions
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"localhost\", 8001), timeout=2); s.close()'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne --proxy-headers -b 0.0.0.0 -p 8001 trawlr.asgi:application"

  # Download service - handles the downloading of media and thumbnails using gevent
  downloader:
    <<: *trawlr-worker
    command: dramatiq-gevent tasks --queues trawlr.default trawlr.downloads -p 1 -t 20
    volumes:
      - media_data:${TRAWLR_STORAGE_ROOT:-/data/trawlr}
      - sessions:/app/sessions
    environment:
      - DJANGO_ALLOW_ASYNC_UNSAFE=true

  # Concierge service - handles Telegram API tasks (history scans, member scans, availability checks)
  # Runs with single process and single thread to avoid rate limiting and API conflicts. Increase threads at your own risk.
  concierge:
    <<: *trawlr-worker
    command: dramatiq tasks --queues trawlr.scans.history trawlr.scans.members --processes 1 --threads 1
    volumes:
      - media_data:${TRAWLR_STORAGE_ROOT:-/data/trawlr}
      - sessions:/app/sessions
    environment:
      - DJANGO_ALLOW_ASYNC_UNSAFE=true

  # Event processing service - processes events queued by the listener (new messages, edits, deletions)
  processor:
    <<: *trawlr-worker
    command: dramatiq events.processor --queues trawlr.events.telegram --processes 2 --threads 4
    volumes:
      - media_data:${TRAWLR_STORAGE_ROOT:-/data/trawlr}
      - sessions:/app/sessions
    environment:
      - DJANGO_ALLOW_ASYNC_UNSAFE=true

  # Listener service - handles long-lived Telegram connections and pushes new events into the queue
  listener:
    <<: *trawlr-worker
    command: python -m listener_service.main
    volumes:
      - media_data:${TRAWLR_STORAGE_ROOT:-/data/trawlr}
      - sessions:/app/sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scheduler service - triggers scheduled tasks based on their defined intervals
  scheduler:
    <<: *trawlr-worker
    command: python -m trawlr.scheduler

  db:
    image: postgres:18.4-alpine
    env_file: .env-local
    ports:
      - "5432:5432"
    command: postgres -c max_connections=1000
    volumes:
      - postgres_data11:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:management
    env_file: .env-local
    ports:
      # - '5672:5672'    # only needed if connecting from outside the docker network
      - '15672:15672'    # RabbitMQ management UI
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
      - source: rabbitmq-conf
        target: /etc/rabbitmq/conf.d/99-custom.conf
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 30s
      retries: 10

volumes:
  postgres_data11:
  media_data:
  rabbitmq_data:
  sessions:

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."
  rabbitmq-conf:
    content: |
      # Disable consumer timeout (default 30min) for long-running tasks
      consumer_timeout = 86400000
